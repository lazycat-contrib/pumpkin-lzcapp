manifest: ./lzc-manifest.yml
pkgout: ./dist
icon: ./icon.png
contentdir: ./content

compose_override:
  services:
    pumpkin:
      security_opt:
        - no-new-privileges:true
      cap_drop:
        - ALL
      read_only: true
      stdin_open: true
      tty: true
      restart: unless-stopped
