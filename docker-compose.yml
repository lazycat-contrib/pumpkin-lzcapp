services:
  pumpkin:
    image: ghcr.io/pumpkin-mc/pumpkin:0.1.0
    ports:
      - "25565:25565"
      - "19132:19132/udp"
    volumes:
      - ./data:/pumpkin
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_drop:
      - ALL
    read_only: true
